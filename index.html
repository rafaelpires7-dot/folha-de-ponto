<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Folha de Ponto · LMI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--n9:#0a1830;--n8:#0e2140;--n7:#15304f;--ac:#3d8bff;--acd:#2568d6;--bg:#f2f4f8;--bd:#e1e6ee;--tx:#152238;--ts:#5b6b84;--ok:#1f9d6b;--dg:#d9503f}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{font-family:Inter,Arial,sans-serif;color:var(--tx);-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0}h2{font-size:19px}h3{font-size:15px}
.mut{color:var(--ts);font-size:12.5px}.sp{flex:1}.err{color:var(--dg);font-size:13px;min-height:18px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.top{background:linear-gradient(90deg,var(--n9),var(--n7));color:#fff;display:flex;align-items:center;gap:14px;padding:12px 20px;position:sticky;top:0;z-index:5}
.top img{height:32px}.top .t{font-weight:800;font-size:15px}.top .s{font-size:11.5px;color:#8fa3c4}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
.card{background:#fff;border:1px solid var(--bd);border-radius:12px;box-shadow:0 1px 2px rgba(10,24,48,.04),0 8px 24px rgba(10,24,48,.06);padding:18px;margin-bottom:16px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 15px;border-radius:9px;border:1px solid var(--bd);background:#fff;color:var(--tx);font:600 13.3px Inter,Arial,sans-serif;cursor:pointer}
.btn:hover{border-color:var(--ac);color:var(--acd)}.btn[disabled]{opacity:.5;cursor:default}
.pri{background:var(--ac);border-color:var(--ac);color:#fff}.pri:hover{background:var(--acd);color:#fff}
.gh{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:#fff}
.big{padding:13px 20px;font-size:14.5px}.sm{padding:4px 9px;font-size:12px}.dg{color:var(--dg)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tab{padding:9px 16px;border-radius:9px;border:1px solid var(--bd);background:#fff;font:600 13.3px Inter,Arial,sans-serif;cursor:pointer;color:var(--ts)}
.tab.on{background:var(--n8);border-color:var(--n8);color:#fff}
input,select{font:inherit;font-size:13.5px;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:#fff;color:var(--tx);max-width:100%}
input:focus,select:focus{outline:2px solid rgba(61,139,255,.35);border-color:var(--ac)}
.scroll{overflow-x:auto}
table.g{width:100%;border-collapse:collapse;font-size:13px}
.g th{background:#eef2f8;color:var(--n8);text-align:left;padding:8px;border-bottom:1.5px solid var(--n8);white-space:nowrap}
.g td{padding:6px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}
.g input,.g select{padding:5px 7px;width:100%;min-width:92px}
.g tr.hoje td{background:#eaf2ff}
.bd{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;background:#eef2f8;color:var(--n7)}
.bd.D{background:#e0efff;color:#1d5fc4}.bd.N{background:#e6e3f8;color:#4a3fa8}.bd.C{background:#fff3d9;color:#9a6b0b}.bd.F{background:#e4f5ec;color:#177a52}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--ts)}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,var(--n9),var(--n7))}
.lc{background:#fff;border-radius:16px;padding:28px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px}
.lc .lgb{background:var(--n8);border-radius:10px;padding:12px;text-align:center}.lc .lgb img{height:44px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--n8);color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:50}
#toast.on{opacity:1}
#pa{display:none}
/* ---- folha impressa (padrão do PDF modelo) ---- */
.pg{font-family:Arial,Helvetica,sans-serif;color:#000;font-size:9pt;background:#fff}
.pg .hd{border-top:2px solid #000;border-bottom:2px solid #000;padding:3px 0;display:flex;justify-content:space-between;align-items:center}
.pg .sm2{font-size:8pt}
.pg .info{display:flex;justify-content:space-between;margin:5mm 0;line-height:1.55;font-size:9.5pt}
.pt{border-collapse:collapse;width:100%;table-layout:fixed}
.pt td,.pt th{border:1px solid #000;height:5.2mm;line-height:1;padding:0 3px;font-size:8.5pt;text-align:center;overflow:hidden}
.pt .gr{background:#d9d9d9;font-weight:400}.pt .nb{border:0}
.pt .dd{text-align:right;font-weight:700}.pt .wd{font-weight:700}.pt .ob{text-align:left;font-size:7.5pt;white-space:nowrap}.pt .es{font-size:7.5pt;white-space:nowrap}
.ft{display:flex;justify-content:space-between;align-items:flex-end;margin-top:6mm;gap:10mm}
.lg{border-collapse:collapse;width:55mm}.lg td{border:1px solid #000;height:5mm;text-align:center;font-size:8.5pt;padding:0 3px}
.sigs{flex:1;display:flex;flex-direction:column;gap:11mm}.ln{border-top:1px solid #000;text-align:center;padding-top:1mm;font-size:8.5pt}
@page{size:A4;margin:8mm}
@media print{html,body{background:#fff}#app,#login,#toast{display:none!important}#pa{display:block}.pg{page-break-after:always}.pg:last-child{page-break-after:auto}}
@media(max-width:640px){.top{padding:10px 12px}.wrap{padding:14px 10px 50px}.big{width:100%;justify-content:center}}
</style>
</head>
<body>
<div id="login"><div class="lc">
  <div class="lgb"><img id="lg" alt="LMI"></div>
  <div><h2>Folha de Ponto</h2><div class="mut">Identifique-se para continuar</div></div>
  <label class="f">Colaborador<select id="lsel"></select></label>
  <label class="f">Senha<input id="lpw" type="password" autocomplete="off" onkeydown="if(event.key==='Enter')entrar()"></label>
  <div id="lerr" class="err"></div>
  <button class="btn pri big" onclick="entrar()">Entrar</button>
</div></div>
<div id="app"></div>
<div id="pa"></div>
<div id="toast"></div>

const SB='https://oavktlrlxaatfphjugql.supabase.co',KEY='sb_publishable_Ug2MnGHP5pvaJIAkPj0oTg_WNyOf85C';
const $=s=>document.querySelector(s);
const MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const WD=['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
const F=['ent','sai','he1','he2'],FN={ent:'ENTRADA',sai:'SAÍDA',he1:'HORA EXTRA · ENTRADA',he2:'HORA EXTRA · SAÍDA'};
const p2=n=>String(n).padStart(2,'0'),iso=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(fn,args){let r,j=null;
  try{r=await fetch(SB+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(args||{})})}catch(e){throw new Error('Sem conexão com o servidor.')}
  try{j=await r.json()}catch(e){}
  if(!r.ok)throw new Error((j&&j.message)||'Erro no servidor ('+r.status+').');
  if(j&&j.erro)throw new Error(j.erro);return j}
let CFG={},USERS=[],LIST=[],ME=null,REG={},SRV={hoje:iso(new Date()),h:new Date().getHours()};
function defPeriod(){const t=new Date();let y=t.getFullYear(),m=t.getMonth()+1;if(t.getDate()<16){m--;if(!m){m=12;y--}}return y+'-'+p2(m)}
let S={tab:'colab',ym:defPeriod(),uid:'',rep:''};
let SES=null;try{SES=JSON.parse(sessionStorage.getItem('pt_ses'))}catch(e){}
function setSes(s){SES=s;try{s?sessionStorage.setItem('pt_ses',JSON.stringify(s)):sessionStorage.removeItem('pt_ses')}catch(e){}}
const cred=()=>({p_id:SES.id,p_senha:SES.senha});
const adm=(op,a,b,c,d)=>api('pt_adm',{p_senha:SES.senha,p_op:op,p_a:a,p_b:b,p_c:c,p_d:d});
const reg=id=>REG[id]||{};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2600)}
function periodDays(ym){const[y,m]=ym.split('-').map(Number),o=[],e=new Date(y,m,15,12);let d=new Date(y,m-1,16,12);while(d<=e){o.push(iso(d));d.setDate(d.getDate()+1)}return o}
const rng=()=>{const d=periodDays(S.ym);return[d[0],d[d.length-1]]};
async function loadRegs(alvo,ini,fim){const j=await api('pt_registros',{...cred(),p_alvo:alvo,p_ini:ini,p_fim:fim});
  SRV={hoje:j.hoje,h:j.h};if(alvo==='*')REG={};else delete REG[alvo];
  j.rows.forEach(x=>{(REG[x.colab_id]=REG[x.colab_id]||{})[x.dia]=x})}
const perLbl=ym=>{const[y,m]=ym.split('-').map(Number);return MES[m-1].toUpperCase()+' / '+MES[m%12].toUpperCase()};
function escala(letra,d){const off={A:0,B:2,C:4,D:6}[letra];if(off==null)return'';let p=(Math.round((new Date(d+'T12:00')-new Date(String(CFG.base).slice(0,10)+'T12:00'))/864e5)-off)%8;if(p<0)p+=8;return p<2?'D':p<4?'N':p==4?'C':'F'}
const EL={D:'Dia 07–19',N:'Noite 19–07',C:'Compensação',F:'Folga'};
const dayLbl=d=>{const t=new Date(d+'T12:00');return`<b>${p2(t.getDate())}/${MES[t.getMonth()]}</b> <span class="mut">${WD[t.getDay()]}</span>`};
const topbar=sub=>`<div class="top"><img src="${LW}" alt="LMI"><div><div class="t">Folha de Ponto Digital</div><div class="s">${esc(sub)}</div></div><div class="sp"></div><button class="btn gh" onclick="sair()">Sair</button></div>`;
const perSel=()=>`<span class="mut">Período iniciado em</span><input type="month" value="${S.ym}" onchange="S.ym=this.value||S.ym;render()">`;
const falha=(e,sub)=>{$('#app').innerHTML=topbar(sub||'')+`<div class="wrap"><div class="card">${esc(e.message)} <button class="btn" onclick="render()">Tentar de novo</button></div></div>`};
const carregando=sub=>{$('#app').innerHTML=topbar(sub)+'<div class="wrap"><div class="card">Carregando…</div></div>'};

/* ---------- login ---------- */
function loginView(){$('#app').innerHTML='';$('#pa').innerHTML='';$('#login').style.display='flex';$('#lg').src=LW;
  $('#lsel').innerHTML=LIST.map(u=>`<option value="${esc(u.id)}">${esc(u.nome)}</option>`).join('')+'<option value="__admin">🔒 Administrador</option>';
  $('#lpw').value='';$('#lerr').textContent=''}
async function abrir(s){const j=await api('pt_entrar',{p_id:s.id,p_senha:s.senha});
  setSes({role:j.role,id:s.id,senha:s.senha});CFG=j.cfg;
  if(j.role==='admin'){USERS=j.users;ME=null}else{ME=j.user;USERS=[j.user]}
  $('#login').style.display='none';await render()}
async function entrar(){const id=$('#lsel').value,pw=$('#lpw').value;$('#lerr').textContent='Entrando…';
  try{await abrir({id,senha:pw})}catch(e){$('#lerr').textContent=e.message}}
function sair(){setSes(null);REG={};ME=null;USERS=[];init()}
async function render(){if(!SES)return loginView();SES.role==='admin'?adminView():userView()}
async function init(){$('#login').style.display='flex';
  try{LIST=await api('pt_lista')}catch(e){LIST=[];loginView();$('#lerr').textContent=e.message;return}
  if(SES){try{await abrir(SES);return}catch(e){setSes(null)}}
  loginView()}

/* ---------- colaborador ---------- */
function target(r,fs){const k=SRV.hoje,y=iso(new Date(new Date(k+'T12:00')-864e5));
  if(fs[0]==='ent'&&!(r[k]&&r[k].ent)&&r[y]&&r[y].ent&&!r[y].sai&&SRV.h<12)return[y,'sai'];
  const d=r[k]||{},f=fs.find(x=>!d[x]);return f?[k,f]:null}
async function marcar(he){try{const j=await api('pt_marcar',{...cred(),p_he:!!he});toast(FN[j.campo]+' registrada às '+j.hora)}catch(e){toast(e.message)}await render()}
async function setMyObs(d,v){try{await api('pt_obs',{...cred(),p_dia:d,p_texto:v});const r=REG[ME.id]=REG[ME.id]||{};r[d]={...(r[d]||{}),obs:v};toast('Salvo')}catch(e){toast(e.message)}}
async function userView(){const u=ME;if(!u)return sair();carregando(u.nome);
  try{const[a,b]=rng();await loadRegs(u.id,a,b)}catch(e){return falha(e,u.nome)}
  const r=reg(u.id),tn=SRV.hoje,b1=target(r,['ent','sai']),b2=target(r,['he1','he2']);
  const rows=periodDays(S.ym).map(d=>{const x=r[d]||{},e=escala(u.letra,d);
    return`<tr class="${d===tn?'hoje':''}"><td>${dayLbl(d)}</td><td>${e?`<span class="bd ${e}">${EL[e]}</span>`:''}</td><td>${x.ent||'—'}</td><td>${x.sai||'—'}</td><td>${x.he1||'—'}</td><td>${x.he2||'—'}</td><td><input style="min-width:250px" maxlength="60" placeholder="Motivo da hora extra, se houver" value="${esc(x.obs||'')}" onchange="setMyObs('${d}',this.value)"></td></tr>`}).join('');
  $('#app').innerHTML=topbar(u.nome)+`<div class="wrap">
  <div class="card"><div class="row"><div><h2>Olá, ${esc(u.nome)}</h2><div class="mut">Hoje: ${tn.split('-').reverse().join('/')} · o horário é registrado pelo servidor</div></div><div class="sp"></div>
  <button class="btn pri big" ${b1?'':'disabled'} onclick="marcar(0)">${b1?'Registrar '+FN[b1[1]]+(b1[0]!==tn?' (turno de ontem)':''):'Dia completo ✔'}</button>
  <button class="btn" ${b2?'':'disabled'} onclick="marcar(1)">${b2?'Registrar '+FN[b2[1]]:'Hora extra completa'}</button></div></div>
  <div class="card"><div class="row"><h3>Meus registros · ${perLbl(S.ym)}</h3><div class="sp"></div>${perSel()}<button class="btn" onclick="pdf('${u.id}')">Gerar PDF</button><button class="btn" onclick="csv()">Baixar CSV</button></div>
  <div class="scroll"><table class="g"><thead><tr><th>Dia</th><th>Escala</th><th>Entrada</th><th>Saída</th><th>HE entrada</th><th>HE saída</th><th>Observação (motivo da hora extra)</th></tr></thead><tbody>${rows}</tbody></table></div></div></div>`}

async function adminView(){const T={colab:['Colaboradores',tColab],reg:['Registros',tReg],rel:['Relatório PDF',tRel],cfg:['Configurações',tCfg]};
  carregando('Administrador');
  if(S.tab==='reg'){const u=USERS.find(x=>x.id===S.uid)||USERS[0];if(u){S.uid=u.id;try{const[a,b]=rng();await loadRegs(u.id,a,b)}catch(e){return falha(e,'Administrador')}}}
  $('#app').innerHTML=topbar('Administrador')+`<div class="wrap"><div class="tabs">${Object.entries(T).map(([k,v])=>`<button class="tab ${S.tab===k?'on':''}" onclick="S.tab='${k}';render()">${v[0]}</button>`).join('')}</div>${T[S.tab][1]()}</div>`}
function tColab(){return`<div class="card"><div class="row"><h3>Colaboradores (${USERS.length})</h3><div class="sp"></div><button class="btn pri" onclick="addU()">+ Novo colaborador</button></div>
  <div class="scroll"><table class="g"><thead><tr><th>ID</th><th>Nome</th><th>Função</th><th>Área</th><th>Letra</th><th>Senha</th><th></th></tr></thead><tbody>${USERS.map(u=>`<tr><td>${esc(u.id)}</td>${['nome','funcao','area'].map(k=>`<td><input value="${esc(u[k])}" onchange="upU('${u.id}','${k}',this.value)"></td>`).join('')}
  <td><select onchange="upU('${u.id}','letra',this.value)">${['','A','B','C','D'].map(l=>`<option ${u.letra===l?'selected':''}>${l}</option>`).join('')}</select></td>
  <td><button class="btn sm" onclick="senhaU('${u.id}')">Redefinir senha</button></td><td><button class="btn sm dg" onclick="delU('${u.id}')">Remover</button></td></tr>`).join('')}</tbody></table></div>
  <p class="mut" style="margin:12px 0 0">As senhas ficam criptografadas no banco: dá para redefinir, mas não para consultar a senha atual.</p></div>`}
async function upU(id,k,v){try{await adm('colab',id,k,v);USERS.find(x=>x.id===id)[k]=v;toast('Salvo')}catch(e){toast(e.message);render()}}
async function addU(){try{const j=await adm('novo');USERS.push({id:j.id,nome:j.nome,funcao:'',area:'',letra:'A'});USERS.sort((a,b)=>a.id.localeCompare(b.id));alert('Colaborador '+j.id+' criado.\nSenha inicial: '+j.senha+'\n\nAnote e, se quiser, redefina em "Redefinir senha".');render()}catch(e){toast(e.message)}}
async function senhaU(id){const u=USERS.find(x=>x.id===id),n=prompt('Nova senha para '+u.nome+' (mínimo 4 caracteres):');if(!n)return;try{await adm('senha',id,n);toast('Senha alterada')}catch(e){toast(e.message)}}
async function delU(id){const u=USERS.find(x=>x.id===id);if(!u||!confirm('Remover '+u.nome+' e TODOS os registros de ponto dele(a)? Esta ação não pode ser desfeita.'))return;
  try{await adm('remover',id);USERS=USERS.filter(x=>x.id!==id);delete REG[id];render()}catch(e){toast(e.message)}}
const uOpts=(sel,all)=>(all?`<option value="*" ${sel==='*'?'selected':''}>Todos os colaboradores</option>`:'')+USERS.map(x=>`<option value="${esc(x.id)}" ${x.id===sel?'selected':''}>${esc(x.nome)}</option>`).join('');
function tReg(){const u=USERS.find(x=>x.id===S.uid)||USERS[0];if(!u)return'<div class="card">Cadastre um colaborador.</div>';const r=reg(u.id);
  return`<div class="card"><div class="row"><h3>Editar registros</h3><div class="sp"></div><select onchange="S.uid=this.value;render()">${uOpts(u.id)}</select><input type="month" value="${S.ym}" onchange="S.ym=this.value||S.ym;render()"></div>
  <div class="scroll"><table class="g"><thead><tr><th>Dia</th><th>Entrada</th><th>Saída</th><th>HE entrada</th><th>HE saída</th><th>Observação</th></tr></thead><tbody>${periodDays(S.ym).map(d=>{const x=r[d]||{};
  return`<tr><td>${dayLbl(d)}</td>${F.map(f=>`<td><input type="time" value="${esc(x[f]||'')}" onchange="setReg('${u.id}','${d}','${f}',this.value)"></td>`).join('')}<td><input style="min-width:250px" maxlength="60" value="${esc(x.obs||'')}" onchange="setReg('${u.id}','${d}','obs',this.value)"></td></tr>`}).join('')}</tbody></table></div></div>`}
async function setReg(id,d,k,v){try{await adm('reg',id,d,k,v);const r=REG[id]=REG[id]||{},x=r[d]=r[d]||{colab_id:id,dia:d};x[k]=v||null;toast('Salvo')}catch(e){toast(e.message)}}
function tRel(){S.rep=S.rep||(USERS[0]||{}).id||'';
  return`<div class="card"><h3>Gerar relatório em PDF</h3><p class="mut">Escolha o colaborador e o período (de 16 de um mês a 15 do seguinte). Na janela de impressão, selecione “Salvar como PDF”.</p>
  <div class="grid" style="margin:14px 0"><label class="f">Colaborador<select onchange="S.rep=this.value">${uOpts(S.rep,true)}</select></label>
  <label class="f">Período iniciado em<input type="month" value="${S.ym}" onchange="S.ym=this.value||S.ym"></label></div>
  <button class="btn pri big" onclick="pdf(S.rep)">Gerar PDF</button></div>`}
function tCfg(){const f=(k,l,t='text')=>`<label class="f">${l}<input type="${t}" value="${esc(String(CFG[k]||'').slice(0,t==='date'?10:999))}" onchange="cfgSet('${k}',this.value)"></label>`;
  return`<div class="card"><h3>Cabeçalho do relatório e acesso</h3><div class="grid" style="margin-top:12px">${f('empresa','Empresa')}${f('endereco','Endereço')}${f('cnpj','CNPJ')}${f('titulo','Título do relatório')}${f('base','Data-base da escala (início do ciclo da letra A)','date')}
  <label class="f">Nova senha do administrador<input type="password" autocomplete="new-password" placeholder="Digite para trocar" onchange="admSenha(this)"></label></div></div>
  <div class="card"><h3>Backup dos dados</h3><p class="mut">Os dados ficam no Supabase e aparecem em todos os aparelhos. Se quiser uma cópia, exporte um arquivo.</p><div class="row"><button class="btn" onclick="bkp()">Exportar backup (.json)</button></div></div>`}
async function cfgSet(k,v){try{await adm('cfg',k,v);CFG[k]=v;toast('Salvo')}catch(e){toast(e.message);render()}}
async function admSenha(el){const v=el.value;if(!v)return;try{await adm('admin_senha',v);setSes({...SES,senha:v});el.value='';toast('Senha do administrador alterada')}catch(e){toast(e.message)}}
async function bkp(){try{await loadRegs('*','2000-01-01','2100-01-01');const rows=Object.values(REG).flatMap(o=>Object.values(o));dl('backup_ponto_'+iso(new Date())+'.json',JSON.stringify({config:CFG,colaboradores:USERS,registros:rows},null,1),'application/json')}catch(e){toast(e.message)}}

/* ---------- PDF (padrão FOLHA_DE_PONTO_.pdf) ---------- */
const EP={D:'07:00 - 19:00',N:'19:00 - 07:00',C:'COMPENSAÇÃO',F:'FOLGA'};
function sheet(u,ym){const[y,m]=ym.split('-').map(Number),r=reg(u.id);
  const rows=periodDays(ym).map(d=>{const t=new Date(d+'T12:00'),x=r[d]||{};return`<tr><td class="dd">${p2(t.getDate())}/${MES[t.getMonth()]}</td><td class="wd">${WD[t.getDay()]}</td><td class="es">${EP[escala(u.letra,d)]||''}</td><td>${x.ent||''}</td><td>${x.sai||''}</td><td>${x.he1||''}</td><td>${x.he2||''}</td><td class="ob">${esc(x.obs||'')}</td></tr>`}).join('');
  const lg=[['07:00','19:00'],['07:00','19:00'],['19:00','07:00'],['19:00','07:00']].map(a=>`<tr><td>${a[0]}</td><td>${a[1]}</td></tr>`).join('')+'<tr><td colspan="2">COMPENSAÇÃO</td></tr>'+'<tr><td colspan="2">FOLGA</td></tr>'.repeat(3);
  return`<div class="pg"><div class="hd"><div><b>EMPRESA &nbsp; ${esc(CFG.empresa)}</b><div class="sm2">${esc(CFG.endereco)} &nbsp;&nbsp;&nbsp;&nbsp; CNPJ: &nbsp; ${esc(CFG.cnpj)}</div><b>${esc(CFG.titulo)}</b></div><img src="${LP}" style="height:32px" alt="LMI"></div>
  <div class="info"><div><b>Colaborador:</b> ${esc(u.nome)}<br>Função: ${esc(u.funcao)}<br>Área: ${esc(u.area)}<br>Letra: ${esc(u.letra)}</div><div><b>Periodo</b> &nbsp; ${perLbl(ym)}<br>Ano: &nbsp;&nbsp;&nbsp;&nbsp; ${y}</div></div>
  <table class="pt"><colgroup><col style="width:9%"><col style="width:13%"><col style="width:14%"><col style="width:9%"><col style="width:9%"><col style="width:8%"><col style="width:8%"><col style="width:30%"></colgroup>
  <thead><tr><th colspan="5" class="gr" style="text-align:left"><b>Período:</b> 16/${MES[m-1]} a 15/${MES[m%12]}</th><th colspan="2" class="gr">Hora Extra</th><th class="nb"></th></tr>
  <tr><th colspan="2">DIA</th><th>ESCALA</th><th>ENTRADA</th><th>SAÍDA</th><th>Entrada</th><th>Saída</th><th>Observação (motivo da HE)</th></tr></thead><tbody>${rows}</tbody></table>
  <div class="ft"><table class="lg">${lg}</table><div class="sigs"><div class="ln">Assinatura do colaborador</div><div class="ln">Carimbo/ Assinatura do responsavel RH/DP</div></div></div></div>`}
async function pdf(id){if(!SES||(SES.role!=='admin'&&id!==SES.id))return;
  const list=id==='*'?USERS:USERS.filter(u=>u.id===id);if(!list.length)return;
  try{const[a,b]=rng();await loadRegs(id,a,b)}catch(e){return toast(e.message)}
  $('#pa').innerHTML=list.map(u=>sheet(u,S.ym)).join('');setTimeout(()=>window.print(),150)}
window.onafterprint=()=>{$('#pa').innerHTML=''};

/* ---------- CSV / download ---------- */
function dl(n,t,m){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m+';charset=utf-8'}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function csv(){const u=ME;if(!u)return;const r=reg(u.id),L=['Data;Dia;Entrada;Saída;HE Entrada;HE Saída;Observação'];
  periodDays(S.ym).forEach(d=>{const t=new Date(d+'T12:00'),x=r[d]||{};L.push([p2(t.getDate())+'/'+p2(t.getMonth()+1)+'/'+t.getFullYear(),WD[t.getDay()],x.ent||'',x.sai||'',x.he1||'',x.he2||'',(x.obs||'').replace(/;/g,',')].join(';'))});
  dl('ponto_'+u.nome.replace(/\s+/g,'_')+'_'+S.ym+'.csv','\ufeff'+L.join('\n'),'text/csv')}
init();
</script>
</body>
</html>
